name: Build and deploy browser demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser_port/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download browser ONNX models
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p outputs/onnx
          for model in \
            virtual_sketching_step.onnx \
            virtual_sketching_faces_step.onnx \
            virtual_sketching_rough_step.onnx; do
            curl --fail --location --retry 3 \
              "https://github.com/${REPOSITORY}/releases/download/browser-models-v1/${model}" \
              --output "outputs/onnx/${model}"
          done

      - name: Install dependencies
        working-directory: browser_port
        run: npm ci

      - name: Test browser runtime
        working-directory: browser_port
        run: npm test

      - name: Build site
        working-directory: browser_port
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: browser_port/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
